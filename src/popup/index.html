<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TweetX settings</title><link rel="stylesheet" href="style.css"></head>
<body><header><img class="mark" src="../icons/icon-48.png" width="48" height="48" alt=""><div><h1>TweetX</h1><p>Better links. Original moments.</p></div></header>
<main><section aria-labelledby="services-title"><div class="section-heading"><h2 id="services-title">Embed service</h2><span class="badge"><span aria-hidden="true"></span>On-device</span></div><p class="hint">Choose the service for your copied post links.</p><div id="services" role="radiogroup" aria-label="Active embed service"></div></section>
<form id="add-service"><label for="domain">Add a service</label><div class="input-row"><input id="domain" placeholder="fixupx, fxtwitter, or a domain" autocomplete="off" spellcheck="false" maxlength="270" required><button type="submit">Add</button></div><p id="preview" class="hint"></p></form>
<p id="status" role="status" aria-live="polite"></p><footer><p>Share → Copy link. Get a clean embed link.</p><p>Right-click a photo to copy or download it.</p><span>No analytics. Settings stay in this browser.</span></footer></main><script src="index.js"></script></body></html>
